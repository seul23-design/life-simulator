        function getUnlockedEndingCount() {
            let count = 0;
            endingList.forEach(end => {
                if (localStorage.getItem(`end_lock_${end.id}`) === "true") count++;
            });
            return count;
        }

        function getRequiredExp(level) { 
            if (level >= 9) return Infinity;
            if (level >= 5) return 6; 
            return level + 2; 
        }

        function toggleBadgeSelect(id) {
            const idx = selectedBadges.indexOf(id);
            if (idx > -1) {
                selectedBadges.splice(idx, 1);
                document.getElementById(`badge-item-${id}`).classList.remove('selected');
            } else {
                if (selectedBadges.length >= 3) {
                    alert("뱃지는 최대 3개까지만 동시에 장착할 수 있습니다!");
                    return;
                }
                selectedBadges.push(id);
                document.getElementById(`badge-item-${id}`).classList.add('selected');
            }
            document.getElementById('badge-count-text').textContent = `선택: ${selectedBadges.length} / 3`;
        }

            playerGender = gender;
            document.getElementById('gender-m').className = gender === '남성' ? 'gender-btn selected-male' : 'gender-btn';
            document.getElementById('gender-f').className = gender === '여성' ? 'gender-btn selected-female' : 'gender-btn';
        }

        function startGame() {
            const inputName = document.getElementById('player-name').value.trim();
            if (inputName !== "") playerName = inputName;
            
            gameMode = "DEFAULT";
            day = 1;
            currentTurn = maxTurn;
            currentEnergy = maxEnergy;
            faintCount = 0;
            inventory = [];
            
            gold = 0;
            levels = { int: 0, cha: 0, str: 0, job: 0 };
            currentExp = { int: 0, cha: 0, str: 0, job: 0 };

            let logIntroAdditions = [];
            selectedBadges.forEach(id => {
                if (id === 'scholar') { levels.int = 3; logIntroAdditions.push("🧠지력Lv.3"); }
                else if (id === 'celeb') { levels.cha = 3; logIntroAdditions.push("✨매력Lv.3"); }
                else if (id === 'physical') { levels.str = 3; logIntroAdditions.push("💪체력Lv.3"); }
                else if (id === 'ceo') { levels.job = 3; logIntroAdditions.push("💼알바Lv.3"); }
                else if (id === 'asset') { gold = 80; logIntroAdditions.push("💰초기자금+80G"); }
                else if (id === 'exhaust') { levels.str = 3; logIntroAdditions.push("🏥체력Lv.3 선행"); }
                else if (id === 'god') { levels.int = 2; levels.cha = 2; levels.str = 2; levels.job = 2; logIntroAdditions.push("👑전스탯Lv.2"); }
                else if (id === 'cyborg') { levels.int = 2; levels.str = 2; logIntroAdditions.push("🤖지력/체력Lv.2"); }
                else if (id === 'politician') { levels.int = 2; levels.cha = 2; logIntroAdditions.push("🏛️지력/매력Lv.2"); }
                else if (id === 'strategist') { levels.int = 2; levels.job = 2; logIntroAdditions.push("📈지력/알바Lv.2"); }
                else if (id === 'model') { levels.cha = 2; levels.str = 2; logIntroAdditions.push("📸매력/체력Lv.2"); }
                else if (id === 'idol') { levels.cha = 2; levels.job = 2; logIntroAdditions.push("🎤매력/알바Lv.2"); }
                else if (id === 'agent') { levels.str = 2; levels.job = 2; logIntroAdditions.push("🥷체력/알바Lv.2"); }

            generateShopItems();
            renderBaseLayout();
            
            let badgeAlert = selectedBadges.length > 0 ? `<br><span style="color:#5f3dc4; font-weight:700;">[🏅 장착 버프 활성화]: ${logIntroAdditions.join(', ')} 이 적용되었습니다!</span>` : "";

            updateUI();

            if (getUnlockedEndingCount() === 0) {
                spawnTutorialModal();
            }
        }

                            매일 아침 발생하는 돌발 상황은 <b>특정 능력치 및 소지 자금</b> 조건이 미달되면 선택지가 짙은 회색으로 완전히 차단됩니다!<br><br>
                            <b>4. 🛒 야간 비밀 상점:</b><br>
                            12턴의 하루 일과가 모두 끝나면 침대 머리맡에서 버프 아이템을 살 수 있습니다.<br><br>
                            <b>5. 🏥 기력 0의 페널티:</b><br>
                            행동 중 기력이 <b>0 이하가 되면 그 즉시 하루가 강제 종료(기절)</b>되며, 당일 야간 상점 이용이 전면 금지됩니다! 기력 관리에 유의하세요.
                        </div>
                        <button class="btn-modal-close btn-tutorial-close" onclick="closeTutorialModal()">가이드 숙지 완료! 시작하기</button>
                    </div>
                </div>
            `;
        }

        function closeTutorialModal() {
            const overlay = document.getElementById('tutorial-overlay');
            if (overlay) overlay.remove();
        }

        function spawnWellbeingModal(currentDay) {
            const gate = document.getElementById('modal-placement-gate');
            if(!gate) return;

            gate.innerHTML = `
                <div class="wellbeing-modal-overlay" id="wb-overlay">
                    <div class="wellbeing-modal-box">
                        <div class="modal-badge-icon">🛌</div>
                        <div class="modal-headline">소소한 행복 배달 완료! (DAY ${currentDay})</div>
                        <div class="modal-subtext" style="text-align:center;">
                            웰빙 해탈 가이드의 축복이 내렸습니다.<br>
                            가방에 <b>[💊 소소한 행복 영양제]</b>가 지급되었습니다!<br><br>
                            <span style="color:#fa5252; font-weight:700;">⚠️ 주의: 오늘 밤 취침 전까지 먹지 않으면 흔적도 없이 사라집니다!</span>
                        </div>
                        <button class="btn-modal-close" onclick="closeWellbeingModal()">기분 좋게 하루 시작하기</button>
                    </div>
                </div>
            `;
        }

        function closeWellbeingModal() {
            const overlay = document.getElementById('wb-overlay');
            if (overlay) overlay.remove();
        }

        function generateShopItems() {
            let shuffled = [...itemDatabase].sort(() => 0.5 - Math.random());
            currentShopItems = shuffled.slice(0, 4);
            boughtItemsToday = []; 
        }

        function getAdjustedCost(baseCost) { let cost = baseCost - levels.str; return cost < 1 ? 1 : cost; }

        function updateUI() {
            if (gameMode === "SETUP" || gameMode === "TITLE") return;

            document.getElementById('profile-display').textContent = `${playerGender === '남성' ? '♂️' : '♀️'} ${playerName}`;
            document.getElementById('day-display').textContent = day <= 7 ? `DAY ${day} (${dayNames[day]})` : "종료";
            document.getElementById('turn-display').textContent = `남은 턴: ${currentTurn}/${maxTurn}`;
            document.getElementById('energy-text').textContent = `${currentEnergy} / ${maxEnergy}`;
            
            let barWidth = (currentEnergy / maxEnergy) * 100;
            if (barWidth > 100) barWidth = 100;
            document.getElementById('energy-bar').style.width = `${barWidth}%`;

            document.getElementById('lvl-int').textContent = levels.int;
            document.getElementById('lvl-cha').textContent = levels.cha;
            document.getElementById('lvl-str').textContent = levels.str;
            document.getElementById('lvl-job').textContent = levels.job;

            document.getElementById('exp-int').textContent = levels.int >= 9 ? "MAX" : `${currentExp.int}/${getRequiredExp(levels.int)}`;
            document.getElementById('exp-cha').textContent = levels.cha >= 9 ? "MAX" : `${currentExp.cha}/${getRequiredExp(levels.cha)}`;
            document.getElementById('exp-str').textContent = levels.str >= 9 ? "MAX" : `${currentExp.str}/${getRequiredExp(levels.str)}`;
            document.getElementById('exp-job').textContent = levels.job >= 9 ? "MAX" : `${currentExp.job}/${getRequiredExp(levels.job)}`;

            document.getElementById('stat-gold').textContent = gold;
            document.getElementById('stat-faint').textContent = faintCount;

            renderInventory();

            if (gameMode === "DEFAULT" && day <= 7) {
                if (currentTurnChoices.length === 0) generateRandomChoices();
                renderGridActions();
            } else if (gameMode === "SHOP") {
                renderShopActions();
            }
        }

        function renderInventory() {
            const chipsContainer = document.getElementById('inventory-chips');
            if (inventory.length === 0) {
                chipsContainer.innerHTML = `<span style="font-size:12px; color:#adb5bd;">보관함이 비어있습니다.</span>`;
                return;
            }
            let html = "";
            inventory.forEach((itemName, index) => {
                let statusLabel = "";
                if (itemName.includes("영양제")) statusLabel = " (기력+10)";
                else if (itemName.includes("에스프레소")) statusLabel = " (기력+25)";
                else if (itemName.includes("몬스터")) statusLabel = " (기력+50)";
                else if (itemName.includes("클로버")) statusLabel = " (엔딩용)";
                else if (itemName.includes("복권")) statusLabel = " (도박성)";

                if (itemName.includes("소소한 행복 영양제")) {
                    html += `<span class="item-chip wellbeing-happy" onclick="useInventoryItem(${index})">${itemName}${statusLabel}</span>`;
                } else {
                    html += `<span class="item-chip" onclick="useInventoryItem(${index})">${itemName}${statusLabel}</span>`;
                }
            });
            chipsContainer.innerHTML = html;
        }

        function useInventoryItem(index) {
            if (gameMode === "EVENT" || gameMode === "SHOP") {
                alert("돌발 상황 진행 중이거나 상점 이용 중에는 아이템을 사용할 수 없습니다.");
                return; 
            }
            const itemName = inventory[index];
            let useSuccess = false;
            let resultText = "";
            
            if (itemName.includes("소소한 행복 영양제")) {
                currentEnergy = Math.min(100, currentEnergy + 10);
                resultText = `💊 <b>소소한 행복 영양제</b>를 복용했습니다! 기력이 소소하게 +10 회복됩니다.`;
                useSuccess = true;
            } else if (itemName.includes("에스프레소")) {
                currentEnergy = Math.min(100, currentEnergy + 25);
                resultText = `☕ <b>에스프레소</b>를 마셔 기력을 25 회복했습니다!`;
                useSuccess = true;
            } else if (itemName.includes("몬스터 드링크")) {
                currentEnergy = Math.min(100, currentEnergy + 50);
                resultText = `🔋 <b>몬스터 드링크</b>를 마셔 기력을 50 회복했습니다!`;
                useSuccess = true;
            } else {
                resultText = `⚠️ <b>${itemName}</b>은 배낭에 소지하는 것만으로 적용되는 기물입니다.`;
            }

            if (useSuccess) {
                inventory.splice(index, 1);
                document.getElementById('display-panel').innerHTML = `<p class="log-text">${resultText}</p>`;
                updateUI();
            } else {
                document.getElementById('display-panel').innerHTML = `<p class="log-text">${resultText}</p>`;
            }
        }

        function generateRandomChoices() {
            const pool = ['work', 'train', 'study', 'hobby', 'rest'];
            currentTurnChoices = [];
            for (let i = 0; i < 4; i++) { currentTurnChoices.push(pool[Math.floor(Math.random() * pool.length)]); }
        }

        function renderGridActions() {
            const actionArea = document.getElementById('action-area');
            let htmlContent = "";

            currentTurnChoices.forEach((type) => {
                if (type === 'work') {
                    const cost = getAdjustedCost(25); const job = contentSheet.work[levels.job];
                    htmlContent += `<button class="btn btn-work" onclick="doAction('work', ${cost})"><span>💼 ${job.name}</span><span class="badge">기력-${cost} / +${job.income}G</span></button>`;
                } else if (type === 'train') {
                    const cost = getAdjustedCost(22);
                    htmlContent += `<button class="btn btn-train" onclick="doAction('train', ${cost})"><span>🏋️ ${contentSheet.train[levels.str]}</span><span class="badge">기력-${cost}</span></button>`;
                } else if (type === 'study') {
                    const cost = getAdjustedCost(15);
                    htmlContent += `<button class="btn btn-study" onclick="doAction('study', ${cost})"><span>📚 ${contentSheet.study[levels.int]}</span><span class="badge">기력-${cost}</span></button>`;
                } else if (type === 'hobby') {
                    const cost = getAdjustedCost(15);
                    htmlContent += `<button class="btn btn-hobby" onclick="doAction('hobby', ${cost})"><span>🎨 ${contentSheet.hobby[levels.cha]}</span><span class="badge">기력-${cost}</span></button>`;
                } else if (type === 'rest') {
                    htmlContent += `<button class="btn btn-rest" onclick="doAction('rest', -12)"><span>🛌 낮잠 휴식</span><span class="badge">기력 +12</span></button>`;
                }
            });
            actionArea.innerHTML = htmlContent;
        }

        function openShopMenu() {
            gameMode = "SHOP";
            document.getElementById('display-panel').innerHTML = `
                <div class="shop-title">🌙 야간 비밀 상점 오픈</div>
                <p class="log-text">내일 일과를 편하게 만들어 줄 버프 아이템을 구매하세요.</p>
            `;
            updateUI();
        }

        function renderShopActions() {
            const actionArea = document.getElementById('action-area');
            let htmlContent = "";

            currentShopItems.forEach((item) => {
                const alreadyBought = boughtItemsToday.includes(item.id);
                const canAfford = gold >= item.price;
                
                if (alreadyBought) {
                    htmlContent += `<button class="btn" style="background:#e9ecef; color:#adb5bd; cursor:not-allowed;" disabled><span>🔒 ${item.name}</span><span class="lock-icon">금일 품절</span></button>`;
                } else {
                    htmlContent += `<button class="btn" style="background:#fff4e6; color:#d9480f;" onclick="buyShopItem('${item.id}', ${item.price})" ${!canAfford ? 'disabled' : ''}><span>${item.name} (${item.price}G)</span><span class="badge">${item.desc}</span></button>`;
                }
            });

            htmlContent += `<button class="btn btn-system" onclick="exitShop()"><span>🔙 쇼핑 종료하고 잘 준비하기</span></button>`;
            actionArea.innerHTML = htmlContent;
        }

        function buyShopItem(id, price) {
            if (boughtItemsToday.includes(id) || gold < price) return;
            gold -= price;
            boughtItemsToday.push(id); 

            let findItem = itemDatabase.find(i => i.id === id);
            let logMsg = "";

            if (findItem.type === 'use') {
                inventory.push(findItem.name);
                logMsg = `🎒 [${findItem.name}]을 수령하여 가방에 보관했습니다. (낮에 클릭해 복용 가능)`;
            } else {
                if (id === 'book') logMsg = addItemExp('int', 3);
                else if (id === 'vitamin') logMsg = addItemExp('str', 3);
                else if (id === 'ampoule') logMsg = addItemExp('cha', 3);
                else if (id === 'guidebook') logMsg = addItemExp('job', 3);
                else if (id === 'clover') { inventory.push("🍀 네잎클로버"); logMsg = `🍀 [네잎클로버] 특수 엔딩용 행운 기물이 영구 가산되었습니다.`; }
                else if (id === 'lotto') {
                    let r = Math.random();
                    if (r < 0.5) logMsg = "😭 복권 개봉: 아쉬운 꽝이었습니다! (0G)";
                    else if (r < 0.85) { gold += 5; logMsg = "🎫 복권 개봉: 아쉬운 소액 당첨입니다. (+5G)"; }
                    else { gold += 30; logMsg = "🎉 복권 개봉: 기분 좋은 중박 당첨! (+30G)"; }
                }
            }

            document.getElementById('display-panel').innerHTML = `<div class="shop-title">🛒 결제 완료</div><p class="log-text">${logMsg}</p>`;
            renderShopActions();
            updateUI();
        }

        function addItemExp(type, amount) {
            if (levels[type] >= 9) return "이미 최고 레벨(MAX) 상태입니다.";
            currentExp[type] += amount;
            let lvUpCount = 0;
            while (currentExp[type] >= getRequiredExp(levels[type])) {
                currentExp[type] -= getRequiredExp(levels[type]);
                levels[type]++;
                lvUpCount++;
                if (levels[type] >= 9) { currentExp[type] = 0; break; }
            }
            let typeName = type === 'int' ? '🧠 지력' : type === 'cha' ? '✨ 매력' : type === 'str' ? '💪 체력' : '💼 알바';
            if (lvUpCount > 0) {
                return `✨ [${typeName}] 경험치 +${amount} 누적! <span class="levelup-text">🎉 레벨 업 -> Lv.${levels[type]}</span>`;
            }
            return `✨ [${typeName}] 경험치 +${amount} 증가했습니다.`;
        }

        function exitShop() {
            gameMode = "EVENT";
            document.getElementById('display-panel').innerHTML = `<p class="log-text">오늘 하루 수고 많으셨습니다. 잘 준비를 하세요.</p>`;
            document.getElementById('action-area').innerHTML = `
                <button class="btn btn-shop-toggle" style="grid-column:span 2;" onclick="openShopMenu()"><span>🛒 야간 상점 원격 접속</span></button>
                <button class="btn btn-system" onclick="nextDay()"><span>☀️ 오늘 일정 정산하고 취침하기</span></button>
            `;
            updateUI();
        }

        function gainExp(type) {
            if (levels[type] >= 9) return "";
            currentExp[type]++;
            if (currentExp[type] >= getRequiredExp(levels[type])) {
                levels[type]++;
                currentExp[type] = 0;
                let typeName = type === 'int' ? '🧠 지력' : type === 'cha' ? '✨ 매력' : type === 'str' ? '💪 체력' : '💼 알바';
                return `<span class="levelup-text">🎉 [${typeName}] 렙업! Lv.${levels[type]}</span>`;
            }
            return "";
        }

        function doAction(type, energyCost) {
            const isLastTurn = (currentTurn === 1);
            currentTurn--;

            if (!isLastTurn && energyCost > 0 && (currentEnergy - energyCost <= 0)) {
                currentEnergy = 0; currentTurnChoices = []; handleForcedEndDay(); return;
            }

            currentEnergy -= energyCost;
            
            if (currentEnergy > maxEnergy) currentEnergy = maxEnergy;
            if (currentEnergy < 0) currentEnergy = 0;

            let msg = ""; let lvMsg = "";

            if (type === 'work') {
                const job = contentSheet.work[levels.job]; gold += job.income; lvMsg = gainExp('job');
                msg = `💼 [${job.name}] 완료! +${job.income}G 가산.`;
            } else if (type === 'train') {
                lvMsg = gainExp('str'); msg = `🏋️ [${contentSheet.train[levels.str - (lvMsg ? 1 : 0)]}] 완료!`;
            } else if (type === 'study') {
                lvMsg = gainExp('int'); msg = `📚 [${contentSheet.study[levels.int - (lvMsg ? 1 : 0)]}] 완료!`;
            } else if (type === 'hobby') {
                lvMsg = gainExp('cha'); msg = `🎨 [${contentSheet.hobby[levels.cha - (lvMsg ? 1 : 0)]}] 완료!`;
            } else if (type === 'rest') {
                msg = "🛌 낮잠 휴식 완료. (기력 +12)";
            }

            document.getElementById('display-panel').innerHTML = `<p class="log-text">${msg}</p>${lvMsg}`;

            if (currentTurn <= 0) {
                document.getElementById('display-panel').innerHTML = `<p class="log-text">${msg}</p>${lvMsg}<br><b style="color:#ff5e62;">🌙 밤이 되었습니다. 오늘 일과가 종료되었습니다!</b>`;
                document.getElementById('action-area').innerHTML = `
                    <button class="btn btn-shop-toggle" style="grid-column:span 2;" onclick="openShopMenu()"><span>🛒 야간 상점 원격 접속</span></button>
                    <button class="btn btn-system" onclick="nextDay()"><span>☀️ 오늘 일정 정산하고 취침하기</span></button>
                `;
                gameMode = "EVENT"; updateUI(); return;
            }

            gameMode = "DEFAULT";
            generateRandomChoices(); 
            updateUI(); 
        }

        function handleForcedEndDay() {
            gameMode = "EVENT";
            faintCount++; 
            document.getElementById('display-panel').innerHTML = `
                <div class="shop-title" style="color:#fa5252;">❌ 과로로 기절 (누적: ${faintCount}회)</div>
                <p class="log-text">기력이 다해 쓰러졌습니다. 능력치는 안전하게 보존되지만 야간 상점은 거래 정지됩니다.</p>
            `;
            document.getElementById('action-area').innerHTML = `<button class="btn btn-system" onclick="nextDay()"><span>☀️ 다음 날 아침 맞이하기</span></button>`;
            updateUI();
        }

        function nextDay() {
            inventory = inventory.filter(itemName => !itemName.includes("소소한 행복 영양제"));

            day++; currentTurn = maxTurn; currentTurnChoices = []; generateShopItems(); 
            if (day > 7) { showEnding(); return; }

            currentEnergy = maxEnergy; 
            let morningAlert = "";
            
            if (selectedBadges.includes('normal')) {
                inventory.push("💊 소소한 행복 영양제");
                spawnWellbeingModal(day);
            }
            if (selectedBadges.includes('lucky')) {
                inventory.push("🎫 한탕 복권");
                morningAlert += " [🍀행운 뱃지: 보너스 일일 복권 가방 인입 완료]";
            }

            gameMode = "EVENT";
            updateUI(); 

            if (day === 2) triggerDay2Event(morningAlert);
            else if (day === 3) triggerDay3Event(morningAlert);
            else if (day === 4) triggerDay4Event(morningAlert);
            else if (day === 5) triggerDay5Event(morningAlert);
            else if (day === 6) triggerDay6Event(morningAlert);
            else if (day === 7) triggerDay7Event(morningAlert);
        }

        /* 🚨 [돌발 상황 제어장치]: 보유 자금 및 조건 미달 시 완벽한 짙은 회색 및 클릭 완전 차단(disabled) 적용 */
        function triggerDay2Event(extra) {
            const coinLocked = gold < 30; 
            const smartLocked = levels.int < 2; 
            
            document.getElementById('display-panel').innerHTML = `<div class="event-title">🚨 DAY 2 돌발: 가상자산 투자 유혹</div><p style="font-size:11px; color:#228be6;">${extra}</p>`;
            document.getElementById('action-area').innerHTML = `
                <button class="btn btn-event" onclick="selectEventOption('coin-yes')" ${coinLocked ? 'disabled' : ''}><span>${coinLocked ? '🔒 [30G 필요] ' : '🪙 '}친구를 믿고 30G SNOW코인 송금</span></button>
                <button class="btn btn-event" onclick="selectEventOption('coin-no')"><span>🙅 거절하고 내 갈 길 간다.</span></button>
                <button class="btn btn-event" onclick="selectEventOption('coin-smart')" ${smartLocked ? 'disabled' : ''}><span>${smartLocked ? '🔒 [지력 2 필요] ' : '💡 '}차트 분석으로 참교육</span></button>
            `;
        }
        function triggerDay3Event(extra) {
            const payLocked = gold < 20; 
            const winLocked = levels.str < 2; 
            
            document.getElementById('display-panel').innerHTML = `<div class="event-title">🚨 DAY 3 돌발: 골목길 취객 무리</div><p style="font-size:11px; color:#228be6;">${extra}</p>`;
            document.getElementById('action-area').innerHTML = `
                <button class="btn btn-event" onclick="selectEventOption('fight-run')"><span>🏃 전력 도망 (기력-15)</span></button>
                <button class="btn btn-event" onclick="selectEventOption('fight-pay')" ${payLocked ? 'disabled' : ''}><span>${payLocked ? '🔒 [20G 필요] ' : '💸 '}20G 통행세 지불</span></button>
                <button class="btn btn-event" onclick="selectEventOption('fight-win')" ${winLocked ? 'disabled' : ''}><span>${winLocked ? '🔒 [체력 2 필요] ' : '👊 '}피지컬로 제압</span></button>
            `;
        }
        function triggerDay4Event(extra) {
            const epicLocked = levels.cha < 3;
            document.getElementById('display-panel').innerHTML = `<div class="event-title">🚨 DAY 4 돌발: 페스티벌 대타 무대</div><p style="font-size:11px; color:#228be6;">${extra}</p>`;
            document.getElementById('action-area').innerHTML = `
                <button class="btn btn-event" onclick="selectEventOption('stage-no')"><span>😥 거절하고 잠적</span></button>
                <button class="btn btn-event" onclick="selectEventOption('stage-bad')"><span>🎤 흑역사 무대 생성</span></button>
                <button class="btn btn-event" onclick="selectEventOption('stage-epic')" ${epicLocked ? 'disabled' : ''}><span>${epicLocked ? '🔒 [매력 3 필요] ' : '✨ '}관객 대규모 홀딩</span></button>
            `;
        }
        function triggerDay5Event(extra) {
            const castLocked = gold < 50; 
            const smartLocked = levels.int < 4;
            document.getElementById('display-panel').innerHTML = `<div class="event-title">🚨 DAY 5 돌발: 길거리 기획사 사기단</div><p style="font-size:11px; color:#228be6;">${extra}</p>`;
            document.getElementById('action-area').innerHTML = `
                <button class="btn btn-event" onclick="selectEventOption('cast-yes')" ${castLocked ? 'disabled' : ''}><span>${castLocked ? '🔒 [50G 필요] ' : '✨ '}계약금 50G 선지급</span></button>
                <button class="btn btn-event" onclick="selectEventOption('cast-no')"><span>🤨 경멸의 눈빛 퇴장</span></button>
                <button class="btn btn-event" onclick="selectEventOption('cast-smart')" ${smartLocked ? 'disabled' : ''}><span>${smartLocked ? '🔒 [지력 4 필요] ' : '🕵️ '}사법 규정 조항 설파</span></button>
            `;
        }
        function triggerDay6Event(extra) {
            const heroLocked = levels.str < 5;
            document.getElementById('display-panel').innerHTML = `<div class="event-title">🚨 DAY 6 돌발: 가벽 붕괴 구조 재난</div><p style="font-size:11px; color:#228be6;">${extra}</p>`;
            document.getElementById('action-area').innerHTML = `
                <button class="btn btn-event" onclick="selectEventOption('rescue-watch')"><span>😰 소리쳐서 타인 유도</span></button>
                <button class="btn btn-event" onclick="selectEventOption('rescue-fail')"><span>🏋️ 무리하다 요추 삐끗</span></button>
                <button class="btn btn-event" onclick="selectEventOption('rescue-hero')" ${heroLocked ? 'disabled' : ''}><span>${heroLocked ? '🔒 [체력 5 필요] ' : '🚒 '}초인 파워로 구조</span></button>
            `;
        }
        function triggerDay7Event(extra) {
            const godLocked = levels.cha < 5;
            document.getElementById('display-panel').innerHTML = `<div class="event-title">🚨 DAY 7 돌발: 명품 패션쇼 런웨이</div><p style="font-size:11px; color:#228be6;">${extra}</p>`;
            document.getElementById('action-area').innerHTML = `
                <button class="btn btn-event" onclick="selectEventOption('runway-pass')"><span>🏃 압박감에 도망</span></button>
                <button class="btn btn-event" onclick="selectEventOption('runway-walk')"><span>🕴️ 목각 뚝딱이 보행</span></button>
                <button class="btn btn-event" onclick="selectEventOption('runway-god')" ${godLocked ? 'disabled' : ''}><span>${godLocked ? '🔒 [매력 5 필요] ' : '👑 '}압도적 아우라 독점</span></button>
            `;
        }

        function selectEventOption(choice) {
            let resultMsg = "";
            if (choice === 'coin-yes') { gold = Math.max(0, gold - 30); resultMsg = "💸 결과: 사기당했습니다. (-30G)"; }
            else if (choice === 'coin-no') { resultMsg = addItemExp('int', 2); }
            else if (choice === 'coin-smart') { gold += 60; resultMsg = "😎 결과: 합의금 명목으로 갈취! (+60G)"; }
            else if (choice === 'fight-run') { currentEnergy = Math.max(0, currentEnergy - 15); resultMsg = "🏃 결과: 사력의 도망 완료. (기력 -15)"; }
            else if (choice === 'fight-pay') { gold = Math.max(0, gold - 20); resultMsg = "💸 결과: 삥을 뜯겼습니다. (-20G)"; }
            else if (choice === 'fight-win') { resultMsg = addItemExp('job', 2); }
            else if (choice === 'stage-no') { resultMsg = "🧘 결과: 평온한 관람객 포지션 유지."; }
            else if (choice === 'stage-bad') { currentExp.cha = 0; resultMsg = "😭 결과: 인터넷 흑역사 박제 (매력 경험치 초기화)"; }
            else if (choice === 'stage-epic') { gold += 100; resultMsg = "🎤 결과: 현장 위로금 수령! (+100G)"; }
            else if (choice === 'cast-yes') { gold = Math.max(0, gold - 50); resultMsg = "😭 결과: 위장 유령 계약 사기단이었습니다. (-50G)"; }
            else if (choice === 'cast-no') { resultMsg = "🚪 결과: 완벽 필터링 통과."; }
            else if (choice === 'cast-smart') { resultMsg = addItemExp('int', 4); }
            else if (choice === 'rescue-watch') { resultMsg = "🚪 결과: 구조대 안전 조치 완료."; }
            else if (choice === 'rescue-fail') { currentEnergy = Math.max(0, currentEnergy - 30); resultMsg = "🚑 결과: 척추 내상 발생 (기력 -30)"; }
            else if (choice === 'rescue-hero') { gold += 120; resultMsg = "🚒 결과: 시민 포상금 정산 완료! (+120G)"; }
            else if (choice === 'runway-pass') { resultMsg = "🧘 결과: 평화 가치 보존."; }
            else if (choice === 'runway-walk') { gold += 20; resultMsg = "🕴️ 결과: 뚝딱이 챌린지 밈 바이럴 정산. (+20G)"; }
            else if (choice === 'runway-god') {
                levels.int++; levels.cha++; levels.str++; levels.job++;
                resultMsg = "👑 결과: 전 무대 장악! 전 스탯 단계가 한 단계 가산됩니다! (전체 Lv +1)";
            }

            document.getElementById('display-panel').innerHTML = `<p class="log-text">${resultMsg}</p>`;
            gameMode = "DEFAULT";
            generateRandomChoices();
            updateUI();
        }

        function showEnding() {
            let endingId = "normal";
            let hasClover = inventory.includes("🍀 네잎클로버");

            let eliteStatsCount = 0;
            if (levels.int >= 5) eliteStatsCount++;
            if (levels.cha >= 5) eliteStatsCount++;
            if (levels.str >= 5) eliteStatsCount++;
            if (levels.job >= 5) eliteStatsCount++;

            if (levels.int >= 9 && levels.cha >= 9 && levels.str >= 9 && levels.job >= 9) { endingId = "god"; }
            else if (faintCount >= 3) { endingId = "exhaust"; }
            else if (gold >= 200) { endingId = "asset"; }
            else if (levels.int >= 9) { endingId = "scholar"; }
            else if (levels.cha >= 9) { endingId = "celeb"; }
            else if (levels.str >= 9) { endingId = "physical"; }
            else if (levels.job >= 9) { endingId = "ceo"; }
            else if (levels.int >= 7 && levels.str >= 7) { endingId = "cyborg"; }
            else if (levels.int >= 7 && levels.cha >= 7) { endingId = "politician"; }
            else if (levels.int >= 7 && levels.job >= 7) { endingId = "strategist"; }
            else if (levels.cha >= 7 && levels.str >= 7) { endingId = "model"; }
            else if (levels.cha >= 7 && levels.job >= 7) { endingId = "idol"; }
            else if (levels.str >= 7 && levels.job >= 7) { endingId = "agent"; }
            else if (eliteStatsCount >= 3) { endingId = "elite"; }
            else if (hasClover) { endingId = "lucky"; }
            else { endingId = "normal"; }

            let currentEndingObj = endingList.find(e => e.id === endingId);
            localStorage.setItem(`end_lock_${endingId}`, "true");

            document.getElementById('display-panel').innerHTML = `
                <div style="width:100%;">
                    <div class="event-title" style="color:#764ba2; font-size:17px;">🎉 7일 완주 엔딩 정산 완료</div>
                    <div style="font-size: 14px; font-weight:800; margin: 4px 0; color:#212529;">${currentEndingObj.name}</div>
                    <p class="log-text" style="font-size:12px; margin-bottom:8px;">${currentEndingObj.desc}</p>
                    <div style="background:#fff3bf; padding:6px; border-radius:8px; font-size:11px; font-weight:700; color:#e67e22; margin-bottom:6px;">
                        🎁 영구 해금 보상 뱃지: [${currentEndingObj.badge}] 획득! 다음 회차 전용 장착 가능.
                    </div>
                    <div class="ending-illustration" style="height:120px; background:#1a1c1e;">${endingIllustrations[endingId]}</div>
                </div>
            `;
            document.getElementById('action-area').innerHTML = `<button class="btn btn-system" style="grid-column: span 2;" onclick="resetToTitle()"><span>🔙 아카이브 메인화면으로 진출</span></button>`;
        }

        function resetToTitle() {
            day = 1; gold = 0; currentEnergy = 100; currentTurn = maxTurn; faintCount = 0;
            levels = { int: 0, cha: 0, str: 0, job: 0 }; currentExp = { int: 0, cha: 0, str: 0, job: 0 };
            currentTurnChoices = []; inventory = []; boughtItemsToday = []; selectedBadges = [];
            showTitleScreen();
        }

        function exportArchiveCode() {
            let unlockedIds = [];
            endingList.forEach(end => { if (localStorage.getItem(`end_lock_${end.id}`) === "true") unlockedIds.push(end.id); });
            if (unlockedIds.length === 0) { alert("해제된 내역이 없습니다."); return; }
            let encoded = btoa(JSON.stringify(unlockedIds));
            navigator.clipboard.writeText(encoded).then(() => { alert("🔒 백업 코드가 클립보드에 복사되었습니다!"); });
        }

        function importArchiveCode() {
            let code = prompt("백업 코드를 입력하세요:"); if (!code) return;
            try {
                let decodedArr = JSON.parse(atob(code.trim()));
                if (Array.isArray(decodedArr)) {
                    decodedArr.forEach(id => { localStorage.setItem(`end_lock_${id}`, "true"); });
                    alert("🎉 도감 및 보상 뱃지가 완벽히 동기화되었습니다!");
                    showArchiveBook();
                }
            } catch(e) { alert("파싱 실패"); }
        }
    </script>
</body>
</html>
